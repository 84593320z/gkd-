name: Build-Release

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: write gkd secrets info
        env:
          GKD_STORE_FILE_BASE64: ${{ secrets.GKD_STORE_FILE_BASE64 }}
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
        run: |
          if [ -z "$GKD_STORE_FILE_BASE64" ]; then
            echo "::error::仓库未配置 GKD_STORE_FILE_BASE64 等签名 Secrets。Release 必须用固定 keystore 签名，否则每次 runner 的 debug 签名互不兼容、版本之间无法覆盖安装。"
            exit 1
          fi
          echo "$GKD_STORE_FILE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/gkd.jks"
          echo "GKD_STORE_FILE=$GITHUB_WORKSPACE/gkd.jks" >> gradle.properties
          echo "GKD_STORE_PASSWORD=$GKD_STORE_PASSWORD" >> gradle.properties
          echo "GKD_KEY_ALIAS=$GKD_KEY_ALIAS" >> gradle.properties
          echo "GKD_KEY_PASSWORD=$GKD_KEY_PASSWORD" >> gradle.properties

      - run: chmod 777 ./gradlew
      # 只出 APK：bundlePlayRelease 要多跑一遍 R8，发版时间翻倍，而 AAB 仅上架 Google Play 才用得到
      - run: ./gradlew app:assembleGkdRelease

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: app/build/outputs/apk/gkd/release

      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: app/build/outputs

      - uses: actions/upload-artifact@v7
        with:
          name: CHANGELOG.md
          path: CHANGELOG.md

  release:
    needs: build
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      # 回填 version/*.json 需要仓库工作树；取默认分支而不是标签提交，因为 App 读的是分支 HEAD
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || 'miuix-ai' }}

      - uses: actions/download-artifact@v8
        with:
          name: outputs
          path: outputs

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: CHANGELOG.md

      - run: ls -R

      - id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body_path: ./CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'beta') }}

      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/app-gkd-release.apk
          asset_name: gkd-x-${{ github.ref_name }}.apk
          asset_content_type: application/vnd.android.package-archive

      # gradle 构建不是字节可复现的，fileSize 只能取这个附件自己的真实字节数；
      # 只改数字，不动 JSON 其余排版。downloadUrl 不指向本次 tag 的文件一律跳过，避免大小和地址不匹配。
      - name: backfill real fileSize
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch || 'miuix-ai' }}
        run: |
          set -u
          SIZE=$(wc -c < release/app-gkd-release.apk | tr -d ' ')
          echo "本次附件真实大小: $SIZE 字节"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          for f in version/stable.json version/beta.json; do
            [ -f "$f" ] || continue
            if ! grep -q "releases/download/$TAG/" "$f"; then
              echo "::warning::$f 的 downloadUrl 不指向 $TAG，跳过回填；发版时记得同步更新 version/*.json"
              continue
            fi
            sed -i -E "s#(\"fileSize\"[[:space:]]*:[[:space:]]*)[0-9]+#\1$SIZE#" "$f"
            if git diff --quiet -- "$f"; then
              echo "$f 已是 $SIZE，无需提交"
              continue
            fi
            git add "$f"
            changed=1
          done
          if [ "$changed" = 1 ]; then
            git commit -m "chore(version): 回填 $TAG 附件真实 fileSize=$SIZE [skip ci]"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            echo "已推送到 $TARGET_BRANCH"
          else
            echo "没有需要回填的文件"
          fi

      - run: zip -r outputs.zip outputs
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: outputs.zip
          asset_name: outputs-${{ github.ref_name }}.zip
          asset_content_type: application/zip
